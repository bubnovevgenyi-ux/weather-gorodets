name: Expand weather project archive
on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/weather-gorodets.tar.gz"
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project into repository root
        run: |
          mkdir -p /tmp/weather-project
          tar -xzf .bootstrap/weather-gorodets.tar.gz -C /tmp/weather-project
          cp -a /tmp/weather-project/weather-gorodets/. .
          rm -rf .bootstrap .github/workflows/expand-archive.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Docker weather service source"
          git push
